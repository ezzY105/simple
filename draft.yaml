models:
    User:
        id: bigIncrements
        name: string
        email: string:unique
        password: string
        remember_token: string:nullable
        timestamps: 'timestamps'

    Product:
        id: bigIncrements
        name: string
        description: text
        price: decimal:10,2
        stock: integer
        category_id: unsignedBigInteger
        timestamps: 'timestamps'

    Category:
        id: bigIncrements
        name: string:unique
        parent_id: unsignedBigInteger:nullable
        timestamps: 'timestamps'

    Order:
        id: bigIncrements
        user_id: unsignedBigInteger
        status: enum:pending,completed,canceled
        total_price: decimal:10,2
        timestamps: 'timestamps'

    OrderItem:
        id: bigIncrements
        order_id: unsignedBigInteger
        product_id: unsignedBigInteger
        quantity: integer
        price: decimal:10,2
        timestamps: 'timestamps'

    ProductReview:
        id: bigIncrements
        product_id: unsignedBigInteger
        user_id: unsignedBigInteger
        rating: integer
        review: text
        timestamps: 'timestamps'

    Cart:
        id: bigIncrements
        user_id: unsignedBigInteger
        timestamps: 'timestamps'

    CartItem:
        id: bigIncrements
        cart_id: unsignedBigInteger
        product_id: unsignedBigInteger
        quantity: integer
        timestamps: 'timestamps'

    ShippingAddress:
        id: bigIncrements
        user_id: unsignedBigInteger
        address_line: string
        city: string
        state: string
        postal_code: string
        country: string
        timestamps: 'timestamps'

# relationships
relations:
    User:
        hasMany:
            - ProductReview
            - Order
            - ShippingAddress
        hasOne: Cart

    Product:
        belongsTo: Category
        hasMany:
            - OrderItem
            - ProductReview

    Category:
        hasMany: Product
        belongsTo: Category

    Order:
        belongsTo: User
        hasMany: OrderItem

    OrderItem:
        belongsTo:
          - Order
          - Product

    ProductReview:
        belongsTo:
          - User
          - Product

    Cart:
        belongsTo: User
        hasMany: CartItem

    CartItem:
        belongsTo:
            - Cart
            - Product

    ShippingAddress:
        belongsTo: User