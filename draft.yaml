models:
  Category:
    # Unique category model blueprint
    name: string:unique
    description: text
    created_at: datetime
    updated_at: datetime

  Product:
    # Product model blueprint with foreign key referencing categories
    name: string
    description: text
    price: decimal:8,2
    stock: integer
    category_id: id:foreign:categories
    created_at: datetime
    updated_at: datetime

  Order:
    # Order model blueprint with foreign key referencing users
    user_id: id:foreign:users
    status: enum[processing, shipped, delivered, cancelled]
    total: decimal:8,2
    created_at: datetime
    updated_at: datetime

relations:
  Order:
    hasMany: OrderItem
    belongsTo: User
    hasOne: Payment
  Product:
    belongsTo: Category
    hasMany: OrderItem
